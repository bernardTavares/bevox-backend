                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/webhooks/metaapi/events:
    post:
      tags: [meta-api]
      summary: bevox-meta-api inbound webhook (push delivery)
      security: []
      description: |
        Receives webhook deliveries from bevox-meta-api gateway.
        Two body shapes:
        - Verification challenge `{verification_challenge: string}` → 200 `{challenge: <echo>}`, no HMAC required.
        - Canonical event `{event_id, event_type, tenant_id, occurred_at, data}` → HMAC validated via `X-Bevox-Signature` Stripe-style `t=<unix>,v1=<hex>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MetaApiVerificationChallenge"
                - $ref: "#/components/schemas/MetaApiEventEnvelope"
      responses:
        "200":
          description: Accepted or challenge echoed
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

