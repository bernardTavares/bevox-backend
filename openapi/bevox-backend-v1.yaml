          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Appointment criado a partir da oferta aceita
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointment_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # C2 Google Calendar — endpoints org-scoped do cliente (Clerk +
  # organization-scope). Os 2 webhooks públicos (GET callback, POST push)
  # NÃO são documentados aqui: por política de webhook HMAC server-to-
  # server (não-cliente, autenticado por HMAC/redirect — same pattern
  # used by metaapi inbound em /api/v1/webhooks/metaapi/events). Lexicon
  # ADR-021.
  /api/v1/organizations/{organization_id}/calendars/{id}/google/connect:
    get:
      tags: [calendar]
      summary: Iniciar conexão Google Calendar (retorna authorize_url)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ResourceId"
        - name: professional_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: URL de autorização OAuth do Google
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/organizations/{organization_id}/calendars/{id}/google/connections:
    get:
      tags: [calendar]
      summary: Listar conexões Google Calendar do calendar
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Lista de conexões
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/organizations/{organization_id}/google/connections/{connection_id}/disconnect:
    post:
      tags: [calendar]
      summary: Desconectar (revogar) conexão Google Calendar
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: connection_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Conexão revogada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # Payments P1 — Stripe Connect Express (ADR-010). Conta org-level.
  # Os 2 redirects públicos (connect-return / connect-refresh) NÃO têm
  # security: são alvos de redirect do fluxo de onboarding Stripe,
  # autenticados pelo query param `org` + estado externo Stripe — mesma
  # política dos webhooks Google/metaapi. POST /webhooks/stripe (assinatura
  # HMAC, não-cliente) fica fora da superfície OpenAPI por precedente.
  /api/v1/organizations/{organization_id}/payment-account/connect:
    post:
      tags: [payments]
      summary: Criar/retomar onboarding Stripe Connect da organização
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Account link de onboarding criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboarding_url: { type: string, format: uri }
                  payment_account:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      onboarding_status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: Falha ao comunicar com o provider (Stripe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/organizations/{organization_id}/payment-account:
    get:
      tags: [payments]
      summary: Obter payment account org-level (reconcile-on-read se stale)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Payment account da organização
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_account:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      organization_id: { type: string, format: uuid }
                      account_holder_type: { type: string }
                      external_account_id: { type: string, nullable: true }
                      onboarding_status: { type: string }
                      charges_enabled: { type: boolean }
                      payouts_enabled: { type: boolean }
                      details_submitted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organization_id}/charges:
    post:
      tags: [payments]
      summary: Criar charge Pix (destination charge + application_fee)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customer_id, amount_total, charge_type]
              properties:
                customer_id: { type: string, format: uuid }
                appointment_id: { type: string, format: uuid }
                service_id: { type: string, format: uuid }
                professional_id: { type: string, format: uuid }
                service_package_id: { type: string, format: uuid, description: Obrigatório quando charge_type=package }
                amount_total: { type: number }
                charge_type: { type: string, enum: [full, package] }
                currency: { type: string, default: BRL }
                payment_method: { type: string, enum: [pix], default: pix }
      responses:
        "201":
          description: Charge criada (Pix provisionado ou já em estado terminal)
          content:
            application/json:
              schema:
                type: object
                properties:
                  charge_id: { type: string, format: uuid }
                  status: { type: string }
                  pix:
                    type: object
                    nullable: true
                    properties:
                      qr_code: { type: string }
                      copy_paste: { type: string }
                      expires_at: { type: string, format: date-time }
                      hosted_instructions_url: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Criação de charge já em andamento (contenção; retryable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "502":
          description: Falha ao comunicar com o provider (Stripe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/organizations/{organization_id}/charges/{charge_id}:
    get:
      tags: [payments]
      summary: Obter charge por id (status expired derivado on-read)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: charge_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Charge encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  charge:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      organization_id: { type: string, format: uuid }
                      customer_id: { type: string, format: uuid, nullable: true }
                      appointment_id: { type: string, format: uuid, nullable: true }
                      service_id: { type: string, format: uuid, nullable: true }
                      professional_id: { type: string, format: uuid, nullable: true }
                      payment_account_id: { type: string, format: uuid }
                      charge_type: { type: string, enum: [deposit, full, package, adjustment] }
                      status:
                        type: string
                        enum: [pending, paid, expired, cancelled, refunded]
                        description: expired é derivado on-read (pending + expires_at no passado); o status persistido permanece pending até o reconcile-cron (follow-on)
                      amount_total: { type: string }
                      amount_platform_fee: { type: string, nullable: true }
                      currency: { type: string }
                      payment_method: { type: string, nullable: true }
                      expires_at: { type: string, format: date-time, nullable: true }
                      paid_at: { type: string, format: date-time, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organization_id}/charges/{charge_id}/refund:
    post:
      tags: [payments]
      summary: Iniciar estorno (full ou partial) de uma charge paga
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: charge_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, reason_code]
              properties:
                amount:
                  type: number
                  description: Valor a estornar em reais (full ou partial; faixa (0, charge.amount_total])
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Motivo do estorno (PRD §12.5, obrigatório)
      responses:
        "201":
          description: Estorno iniciado (pending, succeeded ou failed conforme o Stripe retornar)
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund:
                    type: object
                    properties:
                      provider_refund_id: { type: string }
                      status: { type: string, enum: [pending, succeeded, failed] }
                      amount: { type: number }
                      reason_code: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Estorno já em andamento para esta charge (contenção; retryable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "502":
          description: Falha ao comunicar com o provider (Stripe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/organizations/{organization_id}/service-packages:
    post:
      tags: [payments]
      summary: Criar ServicePackage no catálogo da org
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, sessions_included, price_amount]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                service_id: { type: string, format: uuid }
                sessions_included: { type: integer, minimum: 1 }
                price_amount: { type: number }
                validity_days: { type: integer, minimum: 1 }
      responses:
        "201":
          description: ServicePackage criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_package:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      organization_id: { type: string, format: uuid }
                      name: { type: string }
                      service_id: { type: string, format: uuid, nullable: true }
                      sessions_included: { type: string }
                      price_amount: { type: string }
                      validity_days: { type: string, nullable: true }
                      is_active: { type: boolean }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [payments]
      summary: Listar ServicePackages da org (default active-only)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: include_inactive
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"], default: "false" }
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_packages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        organization_id: { type: string, format: uuid }
                        name: { type: string }
                        service_id: { type: string, format: uuid, nullable: true }
                        sessions_included: { type: string }
                        price_amount: { type: string }
                        validity_days: { type: string, nullable: true }
                        is_active: { type: boolean }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/organizations/{organization_id}/customer-packages:
    get:
      tags: [payments]
      summary: Listar CustomerPackages por cliente (effective-on-read expiry)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: customer_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: include_terminal
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"], default: "false" }
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_packages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        organization_id: { type: string, format: uuid }
                        customer_id: { type: string, format: uuid }
                        service_package_id: { type: string, format: uuid }
                        charge_id: { type: string, format: uuid, nullable: true }
                        status:
                          type: string
                          enum: [active, exhausted, expired, cancelled]
                          description: expired pode vir derivado on-read (active + valid_until passado); persisted transiciona via cron noturno
                        sessions_total: { type: string }
                        sessions_used: { type: string }
                        sessions_remaining: { type: string }
                        valid_until: { type: string, format: date, nullable: true }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # Payments M5-P4 — Manual Payment Mode (canon ADR-023). A org gerencia o
  # dinheiro fora-de-banda (cash, pix manual, transferência); Bevox só registra
  # no ledger. Conta org-level provider='manual', ativa sem Stripe Connect/KYC.
  # connect-manual / mark-paid / expire NÃO usam Idempotency-Key (idempotência
  # vem da construção do service); charges/manual + refund-manual usam.
  /api/v1/organizations/{organization_id}/payment-account/connect-manual:
    post:
      tags: [payments]
      summary: Configurar (idempotente) o modo de pagamento manual da organização
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "201":
          description: Conta manual configurada (ativa imediatamente)
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_account:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      onboarding_status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/organizations/{organization_id}/charges/manual:
    post:
      tags: [payments]
      summary: Criar charge manual (pending; sem Stripe/Pix)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customer_id, amount_total, charge_type]
              properties:
                customer_id: { type: string, format: uuid }
                appointment_id: { type: string, format: uuid }
                service_id: { type: string, format: uuid }
                professional_id: { type: string, format: uuid }
                service_package_id: { type: string, format: uuid, description: Obrigatório quando charge_type=package }
                amount_total: { type: number, exclusiveMinimum: 0 }
                charge_type: { type: string, enum: [full, package] }
                currency: { type: string, default: BRL }
                payment_method:
                  type: string
                  enum: [cash, pix_manual, bank_transfer, boleto_manual, card_manual, other]
      responses:
        "201":
          description: Charge manual criada (status pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  charge_id: { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organization_id}/charges/{charge_id}/mark-paid:
    post:
      tags: [payments]
      summary: Marcar charge manual como paga (converge p/ efeitos paid do Stripe)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: charge_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paid_at, payment_method, reason]
              properties:
                paid_at: { type: string, format: date-time }
                payment_method:
                  type: string
                  enum: [cash, pix_manual, bank_transfer, boleto_manual, card_manual, other]
                reference: { type: string, maxLength: 200 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Charge marcada como paga
          content:
            application/json:
              schema:
                type: object
                properties:
                  charge_id: { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Mark-paid já em andamento para esta charge (contenção; retryable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/organizations/{organization_id}/charges/{charge_id}/refund-manual:
    post:
      tags: [payments]
      summary: Registrar estorno manual de uma charge manual paga (ledger-only)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: charge_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                amount:
                  type: number
                  exclusiveMinimum: 0
                  description: Valor a estornar em reais (full quando omitido; partial na faixa (0, charge.amount_total])
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Estorno manual registrado (succeeded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund:
                    type: object
                    properties:
                      status: { type: string }
                      amount: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Estorno manual já em andamento para esta charge (contenção; retryable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/organizations/{organization_id}/charges/{charge_id}/expire:
    post:
      tags: [payments]
      summary: Expirar manualmente uma charge manual pending (único caminho de expiry)
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: charge_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Charge expirada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/webhooks/stripe/connect-return:
    get:
      tags: [payments]
      summary: Redirect de retorno do onboarding Stripe (reconcile + redirect)
      parameters:
        - name: org
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "302":
          description: Redirect para a URL de retorno do onboarding
          headers:
            Location:
              schema: { type: string, format: uri }

  /api/v1/webhooks/stripe/connect-refresh:
    get:
      tags: [payments]
      summary: Redirect de refresh do onboarding Stripe (novo account link)
      parameters:
        - name: org
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "302":
          description: Redirect para um novo account link de onboarding
          headers:
            Location:
              schema: { type: string, format: uri }
        "404": { $ref: "#/components/responses/NotFound" }
