                $ref: "#/components/schemas/GenericResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organization_id}/executions:
    get:
      tags: [approvals]
      summary: Listar execuções aguardando aprovação humana
      description: |
        Fila de execuções `waiting_approval` (default) ou outro status
        explícito, opcionalmente filtradas por `suggestion_type`
        (`reply|slot|charge|refund`). LIMIT 200 hardcoded no repository;
        paginação real é follow-on. Scoped pelo `organizationId` do
        principal Clerk (`requireOrganizationScope`).
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: status
          in: query
          required: false
          description: Status da execução. Default = `waiting_approval`.
          schema:
            type: string
        - name: suggestion_type
          in: query
          required: false
          description: |
            Filtra por `result_payload->>'suggestion_type'`. Enum casa
            com `listQuerySchema` em `src/modules/executions/schemas.ts`.
          schema:
            type: string
            enum: [reply, slot, charge, refund]
      responses:
        "200":
          description: Página da fila (ordenada por created_at DESC, LIMIT 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingExecutionList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/organizations/{organization_id}/executions/{id}/approve:
    post:
      tags: [approvals]
      summary: Aprovar execução (transição waiting_approval → done)
      description: |
        Aprova a execução pendente. Roda os seams (proposals +
        delivery) e transiciona para `done`. 409 se a execução não
        estiver em `waiting_approval` (reaprovar = conflict; idempotência
        de transição é guarded). 409 também em `slot_conflict` quando o
        slot proposto pela IA já foi ocupado (ADR-011 §133).
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Execução aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionApprovalResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/organizations/{organization_id}/executions/{id}/edit:
    post:
      tags: [approvals]
      summary: Editar response_text antes de aprovar
      description: |
        Substitui o `response_text` proposto pela IA e aprova a execução
        no mesmo passo (transição waiting_approval → done). Mesmas
        semânticas de conflito do approve.
      security:
        - clerkBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionEditBody"
      responses:
        "200":
          description: Execução editada e aprovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionApprovalResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/organizations/{organization_id}/executions/{id}/reject:
    post:
