openapi: 3.1.0
info:
  title: bevox-backend
  version: 1.11.0
  description: |
    API de domínio Bevox — monolito Fastify, Marco 1.

    Superfície canônica do PRD bevox-backend (consume-by-reference, ADR-005:
    `$BEVOX_KNOWLEDGE_PATH/10_prd/bevox-backend/2026-05-15-bevox-backend-prd-v1.md`).

    Identidade de tenant = `organizationId` (TS) / `organization_id` (DB,
    path param) / tabela `organizations`. Fonte: canon `_shared` / ADR-021
    (aceita; supersedes hub-ADR-003). Esta spec é `organizationId`-only — o
    léxico de tenant legado NÃO aparece aqui; ele vive apenas na ponte de
    fronteira do harness em `src/integration/`.

    Três modelos de autenticação:
      - `clerkBearer` — JWT Clerk (usuários do produto / cliente-final).
      - `staffBearer` — JWT staff Bevox HS256 (painel staff; roles
        `bevox_admin|bevox_support|bevox_observer`, ADR-013).
      - `executionToken` — header `X-Execution-Token` (callbacks do harness).
  license:
    name: Proprietary — Bevox
servers:
  - url: http://localhost:3000
    description: Local dev
tags:
  - name: health
    description: Liveness / readiness / métricas
  - name: staff
    description: Sessões e impersonation de staff Bevox (ADR-013)
  - name: staff-ops
    description: |
      Ops cross-org (painel staff) (Módulo 17, B4) — reads (qualquer role staff),
      SSE realtime e 6 ações manuais (bevox_admin|bevox_support; observer
      NÃO). Reconciliação own-domain do orchestration-service (ADR-019).
  - name: webhooks
    description: Webhooks de provedores externos
  - name: organizations
    description: CRUD de organizations + sub-recursos (cliente-final)
  - name: professionals
    description: CRUD de profissionais (scoped por organization)
  - name: services
    description: CRUD de serviços (scoped por organization)
  - name: customers
    description: CRUD de clientes finais (scoped por organization)
  - name: harness
    description: Callbacks do bevox-harness (X-Execution-Token)
  - name: approvals
    description: |
      Ciclo human-in-the-loop sobre execuções (bevox-backend/ADR-019 —
      supersedes hub ADR-025; PRD §5.6 Módulo 9). Fila pendente +
      approve/edit/reject. Scoped por organization (clerkBearer).
  - name: calendar
    description: |
      Agenda (M3-C1) — calendars, disponibilidade e appointments
      (scoped por organization). slot_conflict ⇒ 409.
  - name: meta-api
    description: bevox-meta-api gateway consumer (inbound + health)

components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Clerk de usuário do produto (cliente-final).
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT staff Bevox HS256 (painel staff). Roles bevox_admin|bevox_support|bevox_observer.
    executionToken:
      type: apiKey
      in: header
      name: X-Execution-Token
      description: Token efêmero por execução; autentica callbacks do harness.
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: ID da organization (UUIDv7, ADR-021).
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave de idempotência obrigatória em toda mutação.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: ["NOT_FOUND", "FORBIDDEN", "INVALID_INPUT"]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: "Canonical error code per PRD §9.4 (ex: RATE_LIMITED, NOT_FOUND, VALIDATION_FAILED)"
            message:
              type: string
              description: "Human-readable message (may be translated)"
            details:
              type: object
              additionalProperties: true
              nullable: true
            request_id:
              type: string
              description: "Server-side request correlation id"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: ["ok"]
    Readiness:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        checks:
          type: object
          additionalProperties: true
    StaffLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 512
    StaffRefresh:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 200
    StaffTokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    StaffOpsActionBody:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          description: Justificativa obrigatória; vai para ledger + AuditEvent.
    StaffOpsActionResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        new_execution_id:
          type: string
          format: uuid
          description: Presente em ações que re-dispatcham (replay, dead-letter replay, override-ai).
    ImpersonationStart:
      type: object
      required: [reason, category]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        category:
          type: string
          enum: [support, audit, incident]
    ImpersonationResult:
      type: object
      additionalProperties: true
    MetaApiEventEnvelope:
      type: object
      required: [event_id, event_type, occurred_at, data]
      properties:
        event_id:
          type: string
          format: uuid
          description: UUIDv7 — used for Redis dedupe (TTL 24h)
        event_type:
          type: string
          description: "Canonical: message.received|message.status_updated|template.status_updated|phone_number.quality_changed|waba.connection_changed; or raw.* fallback"
        tenant_id:
          type: [string, "null"]
          format: uuid
          description: meta-api tenant UUIDv7 (mapped to backend organization)
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    MetaApiVerificationChallenge:
      type: object
      required: [verification_challenge]
      properties:
        verification_challenge:
          type: string
          minLength: 1
          maxLength: 128
    OrganizationPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        business_name: { type: string, minLength: 1, maxLength: 200 }
        legal_name: { type: string, maxLength: 200 }
        niche: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        locale: { type: string, minLength: 2, maxLength: 12 }
      additionalProperties: false
    SettingsPatch:
      type: object
      properties:
        default_reply_tone: { type: [string, "null"], maxLength: 120 }
        default_language: { type: [string, "null"], maxLength: 12 }
      additionalProperties: false
    OnboardingAdvance:
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          enum:
            - welcome
            - business_profile
            - professionals
            - services
            - schedule
            - calendar_sync
            - channels
            - payments
            - knowledge
            - manual_assisted
            - copilot_active
      additionalProperties: false
    GenericResource:
      type: object
      additionalProperties: true
    ResourceList:
      type: array
      items:
        $ref: "#/components/schemas/GenericResource"
    ExecutionStatusCallback:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [running, paused, cancelled]
    ExecutionTracesCallback:
      type: object
      required: [traces]
      properties:
        traces:
          type: array
          items:
            type: object
            additionalProperties: true
    ExecutionStreamCallback:
      type: object
      required: [chunk, index]
      properties:
        chunk:
          type: string
          maxLength: 4096
        index:
          type: integer
          minimum: 0
    ExecutionProposal:
      type: object
      required: [action, params, idempotency_key]
      properties:
        action:
          type: string
          enum:
            - create-appointment
            - cancel-appointment
            - reschedule-appointment
            - create-charge
            - send-message
            - waitlist-add
        params:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          minLength: 1
    ExecutionCompleteCallback:
      type: object
      required: [response_text, sentiment, strategy, usage]
      properties:
        response_text:
          type: string
        sentiment:
          type: string
          enum: [positive, neutral, negative, frustrated, angry, confused]
        strategy:
          type: string
          enum: [direct, react, plan-execute, rewoo, workflow, request-human, failed]
        usage:
          type: object
          required: [prompt_tokens, completion_tokens]
          properties:
            prompt_tokens: { type: integer, minimum: 0 }
            completion_tokens: { type: integer, minimum: 0 }
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionProposal"
      additionalProperties: true
    PendingExecution:
      type: object
      description: |
        Item da fila de execuções aguardando aprovação humana
        (bevox-backend/ADR-019 — supersedes hub ADR-025). Forma do row
        retornado por `listPendingApprovals` em
        `src/modules/executions/repository.ts`.
      required: [id, organization_id, conversation_id, status]
      properties:
        id:
          type: string
          format: uuid
          description: Execution id (UUIDv7).
        organization_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            Status atual da execução. Em V1 o filtro default é
            `waiting_approval`; o cliente pode pedir outros status via
            query param `status`.
          examples: ["waiting_approval"]
        result_payload:
          type: [object, "null"]
          additionalProperties: true
          description: |
            Payload bruto produzido pelo harness. Pode incluir
            `response_text`, `proposals[]`, `suggestion_type` etc.
    PendingExecutionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingExecution"
    ExecutionEditBody:
      type: object
      additionalProperties: false
      required: [response_text]
      description: |
        Edita o `response_text` antes de aprovar a execução
        (bevox-backend/ADR-019).
      properties:
        response_text:
          type: string
          minLength: 1
    ExecutionRejectBody:
      type: object
      additionalProperties: false
      required: [rejection_reason_code]
      description: |
        Justifica a rejeição da execução pelo aprovador humano
        (bevox-backend/ADR-019). `rejection_reason_code` é canônico (vai
        para audit + métricas); `rejection_reason_text` é livre.
      properties:
        rejection_reason_code:
          type: string
          minLength: 1
        rejection_reason_text:
          type: string
    ExecutionApprovalResult:
      type: object
      required: [id, status]
      description: |
        Resultado de approve/edit. `status: done` indica que a transição
        foi guardada e seams (proposals + delivery) rodaram com sucesso.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [done]
    ExecutionRejectionResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [rejected]
  responses:
    BadRequest:
      description: Input inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Sem permissão / fora do escopo
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito (idempotência / corrida de estado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Processo vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (Postgres + Redis)
      security: []
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Não pronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /metrics:
    get:
      tags: [health]
      summary: Prometheus scrape endpoint
      security: []
      responses:
        "200":
          description: Exposição Prometheus (text/plain)
          content:
            text/plain:
              schema:
                type: string

  /api/v1/staff/sessions:
    post:
      tags: [staff]
      summary: Login de staff Bevox
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLogin"
      responses:
        "200":
          description: Tokens de sessão staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTokens"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/staff/sessions/refresh:
    post:
      tags: [staff]
      summary: Rotacionar refresh token de staff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRefresh"
      responses:
        "200":
          description: Novos tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTokens"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/staff/impersonation/{organization_id}/start:
    post:
      tags: [staff]
      summary: Iniciar impersonation (bevox_admin|bevox_support)
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpersonationStart"
      responses:
        "200":
          description: Sessão de impersonation criada (AuditEvent emitido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/impersonation/{organization_id}/end:
    post:
      tags: [staff]
      summary: Encerrar impersonation ativa
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Impersonation encerrada (AuditEvent emitido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/staff/dashboard/overview:
    get:
      tags: [staff-ops]
      summary: Visão geral do dashboard ops (cross-org)
      security:
        - staffBearer: []
      parameters:
        - name: organization_id
          in: query
          required: false
          description: Filtro opcional por organization_id (cross-org se ausente).
          schema:
            type: string
      responses:
        "200":
          description: Agregados do dashboard ops
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/executions:
    get:
      tags: [staff-ops]
      summary: Listar execuções (cross-org, paginado)
      security:
        - staffBearer: []
      parameters:
        - name: organization_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Página de execuções
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/executions/{id}:
    get:
      tags: [staff-ops]
      summary: Detalhe de execução
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Execução
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/staff/executions/{id}/traces:
    get:
      tags: [staff-ops]
      summary: Traces de execução
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Traces da execução
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/executions/{id}/reasoning:
    get:
      tags: [staff-ops]
      summary: Reasoning da execução
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Reasoning da execução
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/staff/executions/{id}/intents:
    get:
      tags: [staff-ops]
      summary: Intents da execução
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Intents da execução
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/staff/conversations/{id}/executions:
    get:
      tags: [staff-ops]
      summary: Execuções de uma conversa
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Execuções da conversa
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/windows:
    get:
      tags: [staff-ops]
      summary: Listar buffer windows (cross-org, paginado)
      security:
        - staffBearer: []
      parameters:
        - name: organization_id
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Página de windows
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/windows/{id}:
    get:
      tags: [staff-ops]
      summary: Detalhe de buffer window
      security:
        - staffBearer: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Window
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/staff/dead-letters:
    get:
      tags: [staff-ops]
      summary: Listar dead-letters (cross-org, paginado)
      security:
        - staffBearer: []
      parameters:
        - name: organization_id
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Página de dead-letters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/organization-health:
    get:
      tags: [staff-ops]
      summary: Saúde por organization (cross-org)
      security:
        - staffBearer: []
      parameters:
        - name: organization_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Indicadores de saúde por organization
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/staff/audit-events:
    get:
      tags: [staff-ops]
      summary: Listar audit events (cross-org, paginado)
      security:
        - staffBearer: []
      parameters:
        - name: organization_id
          in: query
          required: false
          schema:
            type: string
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
