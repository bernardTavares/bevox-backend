# bevox-backend — stack local de desenvolvimento.
#
# Sobe Postgres 16 + Redis 7 isolados (dedicados ao bevox-backend).
# A API e o worker rodam localmente via `pnpm dev` / `pnpm worker` por padrão.
# Para subir a API containerizada, use `docker compose --profile app up`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bevox-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bevox_backend
      POSTGRES_USER: bevox
      POSTGRES_PASSWORD: bevox_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevox -d bevox_backend"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bevox-backend-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bevox-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bevox-backend-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["node", "dist/queue/index.js"]

volumes:
  postgres_data:
  redis_data:
