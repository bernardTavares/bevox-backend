name: release
on:
  push:
    # Production releases only. Pre-release tags (v1.0.0-rc.1) are excluded by design.
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bevox-backend
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
      - name: Build & push runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - id: meta-migrator
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bevox-backend
          flavor: |
            prefix=migrator-,onlatest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
      - name: Build & push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
